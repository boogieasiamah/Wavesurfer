name: Build WaveSurfer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Same layout as Flux 512: JUCE 8.0.10 (FetchContent), macOS 10.13+ universal, Windows x64,
# one release job that publishes both. The version in CMakeLists.txt names the release.

jobs:
  macos:
    name: macOS (VST3 + AU + Standalone, universal, 10.13+)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        run: echo "version=$(grep -Eo 'project\(WAVESURFER VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: QC 1 — DSP stress test (all parameters at extremes)
        run: |
          clang++ -std=c++17 -O2 -ISource Tests/StressTest.cpp -o stress
          ./stress

      - name: Configure (JUCE 8.0.10)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          -DWAVESURFER_HOST_TEST=ON
          -DWAVESURFER_SNAPSHOT_TOOL=ON

      - name: Build
        run: cmake --build build --config Release -j 4 --target WaveSurfer_VST3 WaveSurfer_AU WaveSurfer_Standalone WaveSurferHostTest WaveSurferSnapshot WaveSurferPluginStress

      - name: Ad-hoc sign
        run: |
          ART=build/WaveSurfer_artefacts/Release
          for b in "$ART/VST3/WaveSurfer.vst3" "$ART/AU/WaveSurfer.component" "$ART/Standalone/WaveSurfer.app"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict "$b"
          done

      - name: QC 2 — architectures, minimum macOS, imports vs the macOS 10.13 SDK
        run: |
          ART=build/WaveSurfer_artefacts/Release
          BIN="$ART/VST3/WaveSurfer.vst3/Contents/MacOS/WaveSurfer"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64
          lipo -info "$BIN" | grep -q arm64
          vtool -arch x86_64 -show-build "$BIN" | tee /tmp/vtool.txt
          grep -Eq "(minos|version) 10\.13" /tmp/vtool.txt
          curl -fsSL -o sdk.tar.xz https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.13.sdk.tar.xz
          mkdir sdk && tar -xJf sdk.tar.xz -C sdk
          python3 Tests/check_macos_imports.py "$BIN" sdk/MacOSX10.13.sdk x86_64
          python3 Tests/check_macos_imports.py "$ART/AU/WaveSurfer.component/Contents/MacOS/WaveSurfer" sdk/MacOSX10.13.sdk x86_64

      - name: QC 3 — QRA generic extreme-parameter test (shared with Flux 512)
        run: |
          T=$(find build/WaveSurferPluginStress_artefacts -type f -name WaveSurferPluginStress -perm -u+x | head -1)
          "$T"

      - name: QC 4 — load VST3 like a DAW (automation, state, mono, latency, real window)
        run: |
          HOST=$(find build/WaveSurferHostTest_artefacts -type f -name WaveSurferHostTest -perm -u+x | head -1)
          "$HOST" build/WaveSurfer_artefacts/Release/VST3/WaveSurfer.vst3

      - name: QC 5 — real editor windows under load + screenshots
        run: |
          SNAP=$(find build/WaveSurferSnapshot_artefacts -type f -name WaveSurferSnapshot -perm -u+x | head -1)
          "$SNAP" --editor-stress
          "$SNAP" ui-macos.png 2
          "$SNAP" ui-macos-pink.png 2 pink

      - name: QC 6 — Apple auval (strict)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/WaveSurfer_artefacts/Release/AU/WaveSurfer.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -strict -v aufx Wsrf Qrau

      - name: Package installer + zip
        run: bash packaging/make_macos_installer.sh build/WaveSurfer_artefacts/Release "${{ steps.ver.outputs.version }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: WaveSurfer-macOS
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots-macos
          path: ui-macos*.png
          if-no-files-found: ignore

      - name: Crash reports (if any)
        if: always()
        run: |
          for f in ~/Library/Logs/DiagnosticReports/*WaveSurfer* ~/Library/Logs/DiagnosticReports/*Snapshot*; do
            [ -f "$f" ] && { echo "=== $f"; head -150 "$f"; }
          done || true

  windows:
    name: Windows (VST3 + Standalone, x64)
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(grep -Eo 'project\(WAVESURFER VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Configure (JUCE 8.0.10, static runtime)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DWAVESURFER_HOST_TEST=ON -DWAVESURFER_SNAPSHOT_TOOL=ON

      - name: Build
        run: cmake --build build --config Release --parallel --target WaveSurfer_VST3 WaveSurfer_Standalone WaveSurferStressTest WaveSurferPluginStress WaveSurferHostTest WaveSurferSnapshot

      - name: QC 1 — DSP stress test (all parameters at extremes)
        run: build\Release\WaveSurferStressTest.exe

      - name: QC 3 — QRA generic extreme-parameter test (shared with Flux 512)
        run: build\WaveSurferPluginStress_artefacts\Release\WaveSurferPluginStress.exe

      - name: QC 4 — load VST3 like a DAW (automation, state, mono, latency)
        run: build\WaveSurferHostTest_artefacts\Release\WaveSurferHostTest.exe build\WaveSurfer_artefacts\Release\VST3\WaveSurfer.vst3

      - name: QC 5 — real editor windows under load + screenshot
        run: |
          build\WaveSurferSnapshot_artefacts\Release\WaveSurferSnapshot.exe --editor-stress
          build\WaveSurferSnapshot_artefacts\Release\WaveSurferSnapshot.exe ui-windows.png 2

      - name: Installer + zip
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} `
                  /DSourceDir="$env:GITHUB_WORKSPACE\build\WaveSurfer_artefacts\Release\VST3" `
                  /DOutDir="$env:GITHUB_WORKSPACE\dist" packaging\windows\WaveSurfer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "build\WaveSurfer_artefacts\Release\VST3\WaveSurfer.vst3", "build\WaveSurfer_artefacts\Release\Standalone\WaveSurfer.exe" `
                           -DestinationPath "dist\WaveSurfer-${{ steps.ver.outputs.version }}-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: WaveSurfer-Windows
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshot-windows
          path: ui-windows.png
          if-no-files-found: ignore

  release:
    name: GitHub Release
    # Every push to main publishes (or refreshes) the release for the version in CMakeLists.txt.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        run: echo "version=$(grep -Eo 'project\(WAVESURFER VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: WaveSurfer-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WaveSurfer v${{ steps.ver.outputs.version }}
          make_latest: true
          overwrite_files: true
          files: dist/*
          body: |
            **WaveSurfer** — QRA perceptual spectral unmasker. Free, for research and education.

            | File | What it is |
            |---|---|
            | `WaveSurfer-*-macOS.pkg` | macOS installer: VST3 + AU + Standalone, Intel (macOS 10.13+) and Apple Silicon (11+) |
            | `WaveSurfer-*-Windows.exe` | Windows installer: VST3, 64-bit |
            | `*-macOS.zip`, `*-Windows.zip` | The plugins without an installer (Windows zip also has the standalone app) |

            Built on JUCE 8.0.10 (same as Flux 512). Passed in CI on this exact build, macOS and Windows:
            DSP stress test, QRA generic extreme-parameter test, VST3 host test, editor windows under load;
            macOS also `auval -strict`, a REAPER load/render test, and an import check against the macOS 10.13 SDK.

            The installers are not code-signed yet.
            - macOS: right-click the .pkg → Open → Open.
            - Windows: SmartScreen may warn → More info → Run anyway.

  reaper:
    name: REAPER smoke test (load VST3 + AU, open windows, render)
    needs: macos
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: WaveSurfer-macOS
          path: dist

      - name: Install WaveSurfer
        run: |
          cd dist && unzip -q WaveSurfer-*-macOS.zip && cd ..
          D=$(ls -d dist/WaveSurfer-*/ | head -1)
          mkdir -p ~/Library/Audio/Plug-Ins/VST3 ~/Library/Audio/Plug-Ins/Components
          cp -R "$D/WaveSurfer.vst3" ~/Library/Audio/Plug-Ins/VST3/
          cp -R "$D/WaveSurfer.component" ~/Library/Audio/Plug-Ins/Components/
          xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins || true
          codesign --verify --deep --strict ~/Library/Audio/Plug-Ins/VST3/WaveSurfer.vst3
          killall -9 AudioComponentRegistrar 2>/dev/null || true

      - name: Install REAPER
        run: |
          for v in 783 782 781 780 779 778 777 776; do
            if curl -fsSL -o reaper.dmg "https://www.reaper.fm/files/7.x/reaper${v}_universal.dmg"; then echo "REAPER $v"; break; fi
          done
          test -s reaper.dmg
          yes | PAGER=cat hdiutil attach -nobrowse -noverify -mountpoint /tmp/reapervol reaper.dmg > /dev/null
          APP=$(find /tmp/reapervol -maxdepth 2 -name "REAPER*.app" | head -1)
          cp -R "$APP" /tmp/REAPER.app
          hdiutil detach /tmp/reapervol -quiet || true
          ls /tmp/REAPER.app/Contents/MacOS

      - name: Run REAPER with WaveSurfer
        run: |
          rm -f ~/wavesurfer_reaper.txt
          /tmp/REAPER.app/Contents/MacOS/REAPER -nosplash -new "$PWD/Tests/reaper/wavesurfer_smoke.lua" > reaper_stdout.txt 2>&1 &
          PID=$!
          # dismiss first-run dialogs ("select an audio device?" -> No)
          ( for k in $(seq 1 20); do sleep 2
              osascript -e 'tell application "System Events" to tell process "REAPER"
                  repeat with w in windows
                    if exists (button "No" of w) then click button "No" of w
                    if exists (button "OK" of w) then click button "OK" of w
                  end repeat
                end tell' 2>&1 | head -2
            done ) &
          for i in $(seq 1 60); do
            sleep 2
            grep -q "SMOKE TEST DONE" ~/wavesurfer_reaper.txt 2>/dev/null && break
            if ! kill -0 $PID 2>/dev/null; then echo "REAPER EXITED (possible crash) after $((i*2)) s"; break; fi
          done
          screencapture -x reaper-screen.png || true
          sips -s format jpeg -s formatOptions 60 -Z 1100 reaper-screen.png --out screen.jpg >/dev/null 2>&1 || true
          echo "BEGIN_SCREEN_B64"; base64 -i screen.jpg | tr -d '\n'; echo; echo "END_SCREEN_B64"
          echo "----- smoke log"; cat ~/wavesurfer_reaper.txt 2>/dev/null || echo "(no log written)"
          echo "----- stdout"; tail -40 reaper_stdout.txt || true
          ALIVE=0; kill -0 $PID 2>/dev/null && ALIVE=1
          kill -9 $PID 2>/dev/null || true
          ls -la ~/wavesurfer_render* 2>/dev/null || true
          grep -q "SMOKE TEST DONE" ~/wavesurfer_reaper.txt
          grep -q "VST3:WaveSurfer -> fx index [0-9]" ~/wavesurfer_reaper.txt
          test "$ALIVE" = 1

      - name: Crash reports + screen (on failure)
        if: always()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -20 || true
          for f in ~/Library/Logs/DiagnosticReports/REAPER* ~/Library/Logs/DiagnosticReports/*WaveSurfer*; do
            [ -f "$f" ] && { echo "=== $f"; head -200 "$f"; }
          done || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reaper-smoke
          path: |
            reaper-screen.png
            reaper_stdout.txt
            ~/wavesurfer_reaper.txt
